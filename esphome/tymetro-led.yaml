# ============================================================
# TYMetro A1-A9 LED Controller
# NodeMCU v2 / ESP8266 + SN74HC595
# ============================================================

esphome:
  name: tymetro-led
  friendly_name: tymetro-led

esp8266:
  board: nodemcuv2

logger:

api:
  encryption:
    key: !secret tymetro_api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "tymetro-led Fallback Hotspot"
    password: !secret tymetro_fallback_password

captive_portal:

# ============================================================
# Shift register
# ============================================================

sn74hc595:
  - id: tymetro_595
    data_pin: GPIO13    # D7 -> pin 14 SER / DATA
    clock_pin: GPIO14   # D5 -> pin 11 SRCLK / CLOCK
    latch_pin: GPIO12   # D6 -> pin 12 RCLK / LATCH
    sr_count: 1

# ============================================================
# Station LEDs
# A1-A8 = SN74HC595 QA-QH
# A9    = D0 / GPIO16
# ============================================================

switch:
  - platform: gpio
    name: "A1 Taipei Main Station"
    id: tymetro_a1
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 0
      inverted: false

  - platform: gpio
    name: "A2 Sanchong"
    id: tymetro_a2
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 1
      inverted: false

  - platform: gpio
    name: "A3 New Taipei Industrial Park"
    id: tymetro_a3
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 2
      inverted: false

  - platform: gpio
    name: "A4 Xinzhuang Fuduxin"
    id: tymetro_a4
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 3
      inverted: false

  - platform: gpio
    name: "A5 Taishan"
    id: tymetro_a5
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 4
      inverted: false

  - platform: gpio
    name: "A6 Taishan Guihe"
    id: tymetro_a6
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 5
      inverted: false

  - platform: gpio
    name: "A7 National Taiwan Sport University"
    id: tymetro_a7
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 6
      inverted: false

  - platform: gpio
    name: "A8 Chang Gung Memorial Hospital"
    id: tymetro_a8
    restore_mode: ALWAYS_OFF
    pin:
      sn74hc595: tymetro_595
      number: 7
      inverted: false

  - platform: gpio
    name: "A9 Linkou"
    id: tymetro_a9
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO16
      inverted: false

# ============================================================
# Test controls
# Renderer pauses temporarily while tests run.
# ============================================================

button:
  - platform: template
    name: "All LEDs Off"
    id: all_leds_off
    on_press:
      - lambda: |-
          id(tymetro_renderer_paused) = true;
      - switch.turn_off: tymetro_a1
      - switch.turn_off: tymetro_a2
      - switch.turn_off: tymetro_a3
      - switch.turn_off: tymetro_a4
      - switch.turn_off: tymetro_a5
      - switch.turn_off: tymetro_a6
      - switch.turn_off: tymetro_a7
      - switch.turn_off: tymetro_a8
      - switch.turn_off: tymetro_a9
      - delay: 2s
      - lambda: |-
          id(tymetro_renderer_paused) = false;

  - platform: template
    name: "LED Chase Test"
    id: led_chase_test
    on_press:
      - script.execute: chase_test

  - platform: template
    name: "All LEDs On"
    id: all_leds_on
    on_press:
      - lambda: |-
          id(tymetro_renderer_paused) = true;
      - switch.turn_on: tymetro_a1
      - switch.turn_on: tymetro_a2
      - switch.turn_on: tymetro_a3
      - switch.turn_on: tymetro_a4
      - switch.turn_on: tymetro_a5
      - switch.turn_on: tymetro_a6
      - switch.turn_on: tymetro_a7
      - switch.turn_on: tymetro_a8
      - switch.turn_on: tymetro_a9
      - delay: 2s
      - lambda: |-
          id(tymetro_renderer_paused) = false;

script:
  - id: chase_test
    mode: restart
    then:
      - lambda: |-
          id(tymetro_renderer_paused) = true;

      - switch.turn_off: tymetro_a1
      - switch.turn_off: tymetro_a2
      - switch.turn_off: tymetro_a3
      - switch.turn_off: tymetro_a4
      - switch.turn_off: tymetro_a5
      - switch.turn_off: tymetro_a6
      - switch.turn_off: tymetro_a7
      - switch.turn_off: tymetro_a8
      - switch.turn_off: tymetro_a9

      # A1 -> A9
      - switch.turn_on: tymetro_a1
      - delay: 350ms
      - switch.turn_off: tymetro_a1
      - switch.turn_on: tymetro_a2
      - delay: 350ms
      - switch.turn_off: tymetro_a2
      - switch.turn_on: tymetro_a3
      - delay: 350ms
      - switch.turn_off: tymetro_a3
      - switch.turn_on: tymetro_a4
      - delay: 350ms
      - switch.turn_off: tymetro_a4
      - switch.turn_on: tymetro_a5
      - delay: 350ms
      - switch.turn_off: tymetro_a5
      - switch.turn_on: tymetro_a6
      - delay: 350ms
      - switch.turn_off: tymetro_a6
      - switch.turn_on: tymetro_a7
      - delay: 350ms
      - switch.turn_off: tymetro_a7
      - switch.turn_on: tymetro_a8
      - delay: 350ms
      - switch.turn_off: tymetro_a8
      - switch.turn_on: tymetro_a9
      - delay: 350ms
      - switch.turn_off: tymetro_a9

      # A8 -> A1
      - switch.turn_on: tymetro_a8
      - delay: 350ms
      - switch.turn_off: tymetro_a8
      - switch.turn_on: tymetro_a7
      - delay: 350ms
      - switch.turn_off: tymetro_a7
      - switch.turn_on: tymetro_a6
      - delay: 350ms
      - switch.turn_off: tymetro_a6
      - switch.turn_on: tymetro_a5
      - delay: 350ms
      - switch.turn_off: tymetro_a5
      - switch.turn_on: tymetro_a4
      - delay: 350ms
      - switch.turn_off: tymetro_a4
      - switch.turn_on: tymetro_a3
      - delay: 350ms
      - switch.turn_off: tymetro_a3
      - switch.turn_on: tymetro_a2
      - delay: 350ms
      - switch.turn_off: tymetro_a2
      - switch.turn_on: tymetro_a1
      - delay: 350ms
      - switch.turn_off: tymetro_a1

      - lambda: |-
          id(tymetro_renderer_paused) = false;

# ============================================================
# Frame input from Home Assistant
# ============================================================

sensor:
  - platform: homeassistant
    id: tymetro_frame_a
    entity_id: sensor.tymetro_led_frame_a
    internal: true

  - platform: homeassistant
    id: tymetro_frame_b
    entity_id: sensor.tymetro_led_frame_b
    internal: true

# ============================================================
# Renderer state
# ============================================================

globals:
  - id: tymetro_frame_phase
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: tymetro_renderer_paused
    type: bool
    restore_value: no
    initial_value: 'false'

# ============================================================
# 600 ms frame renderer
# ============================================================

interval:
  - interval: 600ms
    then:
      - lambda: |-
          if (id(tymetro_renderer_paused)) {
            return;
          }

          if (isnan(id(tymetro_frame_a).state) ||
              isnan(id(tymetro_frame_b).state)) {
            return;
          }

          int frame_a = (int) id(tymetro_frame_a).state;
          int frame_b = (int) id(tymetro_frame_b).state;
          int mask = id(tymetro_frame_phase) ? frame_b : frame_a;

          id(tymetro_frame_phase) = !id(tymetro_frame_phase);

          bool a1 = mask & (1 << 0);
          bool a2 = mask & (1 << 1);
          bool a3 = mask & (1 << 2);
          bool a4 = mask & (1 << 3);
          bool a5 = mask & (1 << 4);
          bool a6 = mask & (1 << 5);
          bool a7 = mask & (1 << 6);
          bool a8 = mask & (1 << 7);
          bool a9 = mask & (1 << 8);

          if (id(tymetro_a1).state != a1) {
            if (a1) id(tymetro_a1).turn_on();
            else id(tymetro_a1).turn_off();
          }
          if (id(tymetro_a2).state != a2) {
            if (a2) id(tymetro_a2).turn_on();
            else id(tymetro_a2).turn_off();
          }
          if (id(tymetro_a3).state != a3) {
            if (a3) id(tymetro_a3).turn_on();
            else id(tymetro_a3).turn_off();
          }
          if (id(tymetro_a4).state != a4) {
            if (a4) id(tymetro_a4).turn_on();
            else id(tymetro_a4).turn_off();
          }
          if (id(tymetro_a5).state != a5) {
            if (a5) id(tymetro_a5).turn_on();
            else id(tymetro_a5).turn_off();
          }
          if (id(tymetro_a6).state != a6) {
            if (a6) id(tymetro_a6).turn_on();
            else id(tymetro_a6).turn_off();
          }
          if (id(tymetro_a7).state != a7) {
            if (a7) id(tymetro_a7).turn_on();
            else id(tymetro_a7).turn_off();
          }
          if (id(tymetro_a8).state != a8) {
            if (a8) id(tymetro_a8).turn_on();
            else id(tymetro_a8).turn_off();
          }
          if (id(tymetro_a9).state != a9) {
            if (a9) id(tymetro_a9).turn_on();
            else id(tymetro_a9).turn_off();
          }
